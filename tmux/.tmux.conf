# tmux.conf — façon Takuya (craftzdog). True color, undercurl, vi keys.

# True color support (essentiel pour Solarized Osaka dans tmux)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Vi keys en copy-mode
setw -g mode-keys vi
set -g status-keys vi

# Souris
set -g mouse on

# Escape-time bas pour un mode-switch rapide dans nvim
set -sg escape-time 10

# Index des fenêtres/panneaux sans ordre rigide
set -g base-index 1
setw -g pane-base-index 1

# Scroll
set -g history-limit 10000

# Reload du config : prefix r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Pane navigation vim (compatible nvim <C-w>h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split : prefix | et prefix -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Rafraîchir le PATH env (nvm etc.) pour les nouveaux panes
set -g update-environment "PATH DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID GITLAB_TOKEN"

# Status bar minimal
set -g status-style bg=default,fg=default
set -g status-left "#{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}"
set -g status-right "#{pane_current_path}"
set -g status-right-length 80
set -g status-interval 1